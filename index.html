    <!-- ═══ Prevent Flash of Wrong Theme ═══ -->
    <script>
      (function() {
        try {
          var saved = null;
          try { saved = localStorage.getItem('theme_override'); } catch(e) {}
          
          var def = 'DARK'; // Fallback default
          
          // Try to read the live default theme from Google Sheets cache to prevent flash
          try {
            var settingsCache = localStorage.getItem('cellular_app_settings');
            if (settingsCache) {
              var parsed = JSON.parse(settingsCache);
              if (parsed && Array.isArray(parsed.data)) {
                for (var i = 0; i < parsed.data.length; i++) {
                  var row = parsed.data[i];
                  var k = row.key !== undefined ? row.key : row['A'];
                  var v = row.value !== undefined ? row.value : row['B'];
                  if (k && k.trim() === 'default_theme' && v) {
                    var cachedDef = v.trim().toUpperCase();
                    if (cachedDef === 'LIGHT' || cachedDef === 'DARK') {
                      def = cachedDef;
                    }
                    break;
                  }
                }
              }
            }
          } catch(e) {}

          if (saved === 'dark' || (!saved && def !== 'LIGHT')) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
